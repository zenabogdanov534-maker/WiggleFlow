name: Build WiggleFlow APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Unpack WiggleFlow project
        run: |
          base64 -d source-bundle.zip.base64 > source-bundle.zip
          unzip -oq source-bundle.zip -d .
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using runner command-line tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bundle offline VDSR neural model (MIT)
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --max-time 180 'https://huggingface.co/mlboydaisuke/vdsr-litert/resolve/main/vdsr_256_fp16.tflite' -o app/src/main/assets/vdsr_256_fp16.tflite
          python3 - <<'PY'
          from pathlib import Path
          data=Path('app/src/main/assets/vdsr_256_fp16.tflite').read_bytes()
          assert len(data)>1000000 and data[4:8]==b'TFL3', 'Unexpected VDSR model bytes'
          print('VDSR model validated:',len(data),'bytes')
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WiggleFlow-2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
