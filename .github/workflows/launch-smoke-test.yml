name: Android launch smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources
        run: |
          base64 -d source-bundle.zip.base64 > source-bundle.zip
          unzip -oq source-bundle.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          gradle --version || (curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip && unzip -oq /tmp/gradle.zip -d /tmp && echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH")
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble
        run: gradle --no-daemon :app:assembleDebug
      - name: Emulator app launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 420
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.wiggleflow.wallpaper/.SettingsActivity
            sleep 6
            adb logcat -d -s AndroidRuntime:E > /tmp/launch-crash.log
            cat /tmp/launch-crash.log
            if grep -q 'FATAL EXCEPTION' /tmp/launch-crash.log; then echo 'APP_CRASHED'; exit 1; fi
            adb shell pidof com.wiggleflow.wallpaper
            echo "APP_LAUNCHED_OK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-smoke-logs
          path: /tmp/launch-crash.log
          if-no-files-found: ignore
