name: Publish WiggleFlow 6.2 APK
on:
  workflow_run:
    workflows: ["Build WiggleFlow APK"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, 'WiggleFlow 6.2') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download built APK from successful run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p dist
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" -n WiggleFlow-2-debug-apk -D dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/WiggleFlow-6.2-AI-Angle.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v6.2 dist/WiggleFlow-6.2-AI-Angle.apk --repo "$GITHUB_REPOSITORY" --title 'WiggleFlow 6.2 — AI & Angle Dial' --notes 'Adds drag angle dial, exact angle slider and presets, translucent OS label with triple-tap selector, plus existing on-device neural photo/GIF improvements from 6.1. This app changes only wallpaper/editor settings, not the phone operating system.' --latest
