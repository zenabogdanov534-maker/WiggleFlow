name: Publish verified WiggleFlow 6.2 APK
on:
  push:
    paths: ['.github/workflows/publish-v62-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch APK built from WiggleFlow 6.2 commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh run download 41652624745 --repo "$GITHUB_REPOSITORY" -n WiggleFlow-2-debug-apk -D dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/WiggleFlow-6.2-AI-Angle.apk
      - name: Replace stale asset with verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v6.2 dist/WiggleFlow-6.2-AI-Angle.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release view v6.2 --repo "$GITHUB_REPOSITORY"
