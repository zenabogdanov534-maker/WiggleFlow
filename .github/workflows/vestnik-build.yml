name: Build Vestnik Android APK
on:
  push:
    branches: [vestnik-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract Vestnik application
        run: unzip -oq vestnik-source.zip -d vestnik-android
      - name: Build debug APK
        working-directory: vestnik-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Vestnik-APK
          path: vestnik-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
